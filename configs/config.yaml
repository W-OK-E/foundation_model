defaults:
  - model: baseline
  - dataset: idrid
  - accelerator: gpu
  - report: seg
  - _self_

model:
  train_metrics:
    _target_: metrics.torch_metrics.SegmentationMetrics
    num_classes: ${dataset.num_classes}
    class_names: ${dataset.class_names}
    ignore_index: ${dataset.ignore_index}
    multi_label: ${dataset.multi_label}
    is_3d: ${dataset.is_3d}

  val_metrics:
    _target_: metrics.torch_metrics.SegmentationMetrics
    num_classes: ${dataset.num_classes}
    class_names: ${dataset.class_names}
    ignore_index: ${dataset.ignore_index}
    multi_label: ${dataset.multi_label}
    is_3d: ${dataset.is_3d}

  test_metrics:
    _target_: metrics.torch_metrics.SegmentationMetrics
    num_classes: ${dataset.num_classes}
    class_names: ${dataset.class_names}
    ignore_index: ${dataset.ignore_index}
    multi_label: ${dataset.multi_label}
    is_3d: ${dataset.is_3d}
    
datamodule:
  _target_: data.datamodule.SegDataModule
  _recursive_: false
  train_dataset: ${dataset.train_dataset}
  val_dataset: ${dataset.val_dataset}
  test_dataset: ${dataset.test_dataset}
  global_batch_size: ${dataset.global_batch_size}
  num_workers: ${accelerator.num_workers}
  num_nodes: ${accelerator.num_nodes}
  num_devices: ${accelerator.devices}

trainer:
  _target_: pytorch_lightning.Trainer
  devices: ${accelerator.devices}
  accelerator: ${accelerator.accelerator}
  strategy: ${accelerator.strategy}
  num_nodes: ${accelerator.num_nodes}
  precision: ${accelerator.precision}
  max_epochs: 500
  check_val_every_n_epoch: 10

viaualizer:
  _target_: utils.visualizer.Visualizer
  vis: ${vis}
  vis_count: ${vis_count}
  root_dir: ${root_dir}
  experiment_name: ${experiment_name}
  
logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  save_dir: ${root_dir}
  name: ${experiment_name}
  project: ELiTNet
  log_model: False
  offline: False
  entity: om-mitmpl2023-manipal

checkpoints:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: ${root_dir}/checkpoints/${experiment_name}
  filename: 'best_dice_ckpt'
  monitor: val/miou
  save_last: True
  save_top_k: 1
  every_n_epochs: 1
  mode: max
  enable_version_counter: False
  
progress_bar:
  _target_: pytorch_lightning.callbacks.TQDMProgressBar
  refresh_rate: ${accelerator.progress_bar_refresh_rate}

data_dir: ${root_dir}/datasets
root_dir:  ${hydra:runtime.cwd}
experiment_name: ${dataset.name}_${model.name}
mode: train # change that to eval to do the testing
num_classes: ${dataset.num_classes}
dry_run: False
vis: True
vis_count: 5
hydra:
  run:
    dir: outputs/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}/${experiment_name}
  job:
    chdir: true

