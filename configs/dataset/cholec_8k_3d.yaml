name: Cholec3D
is_3d: True
global_batch_size: 1
img_size: [128, 128, 128]  # d x h x w
num_channels: 3
num_classes: 12
ignore_index: ~
class_names: ["Black Background","Abdominal Wall","Liver",
            "Gastrointestinal Tract","Fat","Grasper","Connective Tissue",
            "Blood","Cystic Duct","L-hook Electrocautery",
            "Gallbladder","Hepatic Vein"]
mean_per_channel: [0.3782772, 0.23324355, 0.22724209]
std_per_channel: [0.27367861, 0.23258302, 0.21778946]
multi_label: False
dry_run: False
cls_weights:  [
    3.07611788e-01, 2.79015445e+03, 3.25865581e+00, 5.79923131e-01,
    8.38769630e-01, 1.92239589e-01, 1.15761036e+00, 7.04655605e-01,
    8.80164325e-01, 3.56306789e+00, 1.83491041e+00, 1.67977953e+01
]

train_dataset:
  _partial_: false
  _target_: data.data3d.Dataset3D
  root_dir: ${data_dir}/cholec_8k_3d
  split: train
  target_depth: 128
  target_height: 128
  target_width: 128
  extraction_mode: center
  mean: ${..mean_per_channel}
  std: ${..std_per_channel}
  dry_run: ${..dry_run}

val_dataset:
  _partial_: false
  _target_: data.data3d.Dataset3D
  root_dir: ${data_dir}/cholec_8k_3d
  split: val
  target_depth: 128
  target_height: 128
  target_width: 128
  extraction_mode: center
  mean: ${..mean_per_channel}
  std: ${..std_per_channel}
  dry_run: ${..dry_run}

test_dataset:
  _partial_: false
  _target_: data.data3d.Dataset3D
  root_dir: ${data_dir}/cholec_8k_3d
  split: test
  target_depth: 128
  target_height: 128
  target_width: 128
  extraction_mode: center
  mean: ${..mean_per_channel}
  std: ${..std_per_channel}
  dry_run: ${..dry_run}
