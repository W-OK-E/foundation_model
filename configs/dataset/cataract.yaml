name: Cataracts
global_batch_size: 8
img_size: [360, 640]
num_channels: 3
num_classes: 11
ignore_index: 0
class_names: ["pupil", "cornea", "skin", "iris", "surgical_instrument", "hand", "speculum", "other_instruments", "lens", "background", "misc"]
mean_per_channel: [0.30843202, 0.26594361, 0.21238147]
std_per_channel: [0.30274876, 0.23929678, 0.20821963]

train_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/Cataracts/
  split: train
  img_size : ${..img_size}

val_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/Cataracts/
  split: val
  img_size : ${..img_size}

test_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/Cataracts/
  split: val
  img_size : ${..img_size}
