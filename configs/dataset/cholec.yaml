name: Cholec
global_batch_size: 2
img_size: [480, 854]
num_channels: 3
num_classes: 12
ignore_index: 0
class_names: ["Black Background","Abdominal Wall","Liver",
            "Gastrointestinal Tract","Fat","Grasper","Connective Tissue",
            "Blood","Cystic Duct","L-hook Electrocautery",
            "Gallbladder","Hepatic Vein"]

train_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/Cholec/
  split: train
  img_size : ${..img_size}

val_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/Cholec/
  split: val
  img_size : ${..img_size}

test_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/Cholec/
  split: test
  img_size : ${..img_size}
