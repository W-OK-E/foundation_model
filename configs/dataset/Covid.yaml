name: Covid_19
global_batch_size: 32
img_size: [512, 512]
train_im_size: [512, 512]
num_channels: 3
num_classes: 2
ignore_index: ~
class_names: ["Black Background","Lesions"]
mean_per_channel: [0.1625563, 0.1625563, 0.1625563]
std_per_channel: [0.16773874, 0.16773874, 0.16773874]
multi_label: False
dry_run: False
cls_weights:  [0.50765461, 33.16006091]

train_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/Covid_19/
  split: train
  img_size : ${..img_size}
  mean: ${..mean_per_channel}
  std: ${..std_per_channel}
  multi_label: ${..multi_label}
  dry_run: ${..dry_run}

val_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/Covid_19/
  split: val
  img_size : ${..img_size}
  mean: ${..mean_per_channel}
  std: ${..std_per_channel}
  multi_label: ${..multi_label}
  dry_run: ${..dry_run}

test_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/Covid_19/
  split: test
  img_size : ${..img_size}
  mean: ${..mean_per_channel}
  std: ${..std_per_channel}
  multi_label: ${..multi_label}
  dry_run: ${..dry_run}
