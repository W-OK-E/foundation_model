name: HRF
global_batch_size: 2
img_size: 512
num_channels: 3
num_classes: 2
ignore_index: 0
class_names: ["background", "vessel"]

train_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/HRF/
  split: train
  img_size : ${img_size}


val_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/HRF/
  split: val
  img_size : ${img_size}

test_dataset:
  _partial_: false
  _target_: data.data.SEGDataset
  root_dir: ${data_dir}/HRF/
  split: test
  img_size : ${img_size}
